<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>心臓と血液の循環　穴うめ</title>
<style>
:root{--navy:#3a5f8a;--red:#d8343a;--ok:#1f8a4c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'UD デジタル 教科書体 NK','Hiragino Maru Gothic ProN','Noto Sans JP',sans-serif;background:#f4f6f9;color:#222}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #dde3ea;padding:8px 10px 6px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
h1{font-size:16px;margin:0 8px 0 0}
.tab{border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:999px;padding:6px 14px;font:inherit;font-weight:bold;font-size:15px}
.tab.on{background:var(--navy);color:#fff}
.stat{font-size:14px;margin-left:auto;white-space:nowrap}
.stat b{font-size:17px}
.tools{margin-top:6px}
.tool{border:1px solid #bbb;background:#fafafa;border-radius:8px;padding:5px 10px;font:inherit;font-size:13px}
.tool.on{background:#333;color:#fff;border-color:#333}
main{max-width:820px;margin:0 auto;padding:8px 6px 200px}
svg.page{width:100%;height:auto;background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);touch-action:manipulation}
.gray .fig{filter:grayscale(1) contrast(.9) brightness(1.08)}
.bl{cursor:pointer}
.bl rect.hit{fill:rgba(58,95,138,.06);stroke:none}
.bl.sel rect.hit{fill:rgba(255,196,0,.35);stroke:#d9a300;stroke-width:3}
.bl.done rect.hit{fill:transparent}
.bl.bad rect.hit{animation:bad .45s}
@keyframes bad{0%,100%{fill:rgba(216,52,58,.0)}30%{fill:rgba(216,52,58,.45)}}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;background:#fff;border-top:3px solid var(--navy);padding:10px 10px calc(12px + env(safe-area-inset-bottom));
  transform:translateY(110%);transition:transform .18s;box-shadow:0 -4px 16px rgba(0,0,0,.12)}
#sheet.open{transform:none}
#sheet .q{font-size:14px;color:#555;margin:0 0 8px}
#choices{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
#choices.two{grid-template-columns:repeat(2,1fr)}
.ch{font:inherit;font-weight:bold;font-size:18px;padding:12px 4px;border-radius:10px;border:2px solid #9fb3c8;background:#f7fafd;color:#1d2f45}
.ch:disabled{opacity:.35;text-decoration:line-through}
.ch.art{color:#c0392b}.ch.ven{color:#2f5fbf}
#close{position:absolute;right:10px;top:6px;border:none;background:none;font-size:22px;color:#777}
#clear{position:fixed;inset:0;z-index:20;background:rgba(20,30,45,.55);display:none;align-items:center;justify-content:center}
#clear.show{display:flex}
#clear .box{background:#fff;border-radius:16px;padding:22px 26px;text-align:center;min-width:260px}
#clear h2{margin:0 0 6px;font-size:26px;color:var(--ok)}
#clear p{margin:4px 0;font-size:17px}
#clear .best{color:#a06a00;font-weight:bold}
.big{font:inherit;font-weight:bold;font-size:18px;padding:10px 22px;border-radius:999px;border:none;background:var(--navy);color:#fff;margin:12px 4px 0}
.big.sub{background:#e8eef5;color:var(--navy)}
</style></head><body>
<header>
  <div class="row">
    <h1>心臓と血液の循環</h1>
    <button class="tab on" data-p="0">表　心臓</button>
    <button class="tab" data-p="1">裏　循環</button>
    <div class="stat">のこり <b id="left">0</b>　ミス <b id="miss">0</b>　<span id="time">0:00</span></div>
  </div>
  <div class="row tools">
    <button class="tool" id="gray">色なし（むずかしい）</button>
    <button class="tool" id="reset">もう一回</button>
    <span style="font-size:12px;color:#777">空欄をタップして、下から選ぶ</span>
  </div>
</header>
<main id="main"></main>
<div id="sheet"><button id="close" aria-label="とじる">×</button><p class="q" id="q"></p><div id="choices"></div></div>
<div id="clear"><div class="box"><h2>クリア！</h2><p id="res"></p><p class="best" id="best"></p>
  <button class="big" id="again">もう一回</button><button class="big sub" id="other">もう片方へ</button></div></div>

font-weight=\"normal\" fill=\"#222\" text-anchor=\"start\">を受けとる</text><rect x=\"303\" y=\"909\" width=\"112\" height=\"30\" rx=\"5\" fill=\"#fff\" stroke=\"#3a5f8a\" stroke-width=\"2\"/><rect x=\"487\" y=\"909\" width=\"112\" height=\"30\" rx=\"5\" fill=\"#fff\" stroke=\"#3a5f8a\" stroke-width=\"2\"/><text x=\"380\" y=\"956\" font-family=\"&apos;UD デジタル 教科書体 NK&apos;,&apos;UD Digi Kyokasho NK-R&apos;,&apos;Hiragino Maru Gothic ProN&apos;,&apos;Noto Sans JP&apos;,sans-serif\" font-size=\"11.5\" font-weight=\"normal\" fill=\"#666\" text-anchor=\"middle\">赤＝酸素を多くふくむ血液（動脈血）　青＝酸素の少ない血液（静脈血）</text><text x=\"380\" y=\"974\" font-family=\"&apos;UD デジタル 教科書体 NK&apos;,&apos;UD Digi Kyokasho NK-R&apos;,&apos;Hiragino Maru Gothic ProN&apos;,&apos;Noto Sans JP&apos;,sans-serif\" font-size=\"10\" font-weight=\"normal\" fill=\"#999\" text-anchor=\"middle\">図：Wikimedia Commons（DBCLS・CC BY 4.0）</text>", "blanks": [{"id": "n1", "x": 46, "y": 606, "w": 134, "h": 40, "ans": "静脈", "set": "names", "kind": "text", "tx": 56, "ty": 637}, {"id": "b1", "x": 42, "y": 652, "w": 140, "h": 38, "ans": "静脈血", "set": "blood", "kind": "circle", "cx": {"動脈血": 82, "静脈血": 150}, "cy": 670}, {"id": "n2", "x": 46, "y": 306, "w": 134, "h": 40, "ans": "右心房", "set": "names", "kind": "text", "tx": 56, "ty": 337}, {"id": "b2", "x": 42, "y": 352, "w": 140, "h": 38, "ans": "静脈血", "set": "blood", "kind": "circle", "cx": {"動脈血": 82, "静脈血": 150}, "cy": 370}, {"id": "n3", "x": 46, "y": 436, "w": 134, "h": 40, "ans": "右心室", "set": "names", "kind": "text", "tx": 56, "ty": 467}, {"id": "b3", "x": 42, "y": 482, "w": 140, "h": 38, "ans": "静脈血", "set": "blood", "kind": "circle", "cx": {"動脈血": 82, "静脈血": 150}, "cy": 500}, {"id": "n4", "x": 46, "y": 116, "w": 134, "h": 40, "ans": "肺動脈", "set": "names", "kind": "text", "tx": 56, "ty": 147}, {"id": "b4", "x": 42, "y": 162, "w": 140, "h": 38, "ans": "静脈血", "set": "blood", "kind": "circle", "cx": {"動脈血": 82, "静脈血": 150}, "cy": 180}, {"id": "n5", "x": 614, "y": 116, "w": 134, "h": 40, "ans": "肺静脈", "set": "names", "kind": "text", "tx": 624, "ty": 147}, {"id": "b5", "x": 610, "y": 162, "w": 140, "h": 38, "ans": "動脈血", "set": "blood", "kind": "circle", "cx": {"動脈血": 650, "静脈血": 718}, "cy": 180}, {"id": "n6", "x": 614, "y": 286, "w": 134, "h": 40, "ans": "左心房", "set": "names", "kind": "text", "tx": 624, "ty": 317}, {"id": "b6", "x": 610, "y": 332, "w": 140, "h": 38, "ans": "動脈血", "set": "blood", "kind": "circle", "cx": {"動脈血": 650, "静脈血": 718}, "cy": 350}, {"id": "n7", "x": 614, "y": 436, "w": 134, "h": 40, "ans": "左心室", "set": "names", "kind": "text", "tx": 624, "ty": 467}, {"id": "b7", "x": 610, "y": 482, "w": 140, "h": 38, "ans": "動脈血", "set": "blood", "kind": "circle", "cx": {"動脈血": 650, "静脈血": 718}, "cy": 500}, {"id": "n8", "x": 614, "y": 606, "w": 134, "h": 40, "ans": "動脈", "set": "names", "kind": "text", "tx": 624, "ty": 637}, {"id": "b8", "x": 610, "y": 652, "w": 140, "h": 38, "ans": "動脈血", "set": "blood", "kind": "circle", "cx": {"動脈血": 650, "静脈血": 718}, "cy": 670}, {"id": "c0", "x": 598, "y": 20, "w": 150, "h": 40, "ans": "肺循環", "set": "circ", "kind": "text", "tx": 673, "ty": 47, "anchor": "middle"}, {"id": "c1", "x": 598, "y": 770, "w": 150, "h": 40, "ans": "体循環", "set": "circ", "kind": "text", "tx": 673, "ty": 797, "anchor": "middle"}, {"id": "g00", "x": 203, "y": 3, "w": 112, "h": 30, "ans": "二酸化炭素", "set": "gas", "kind": "text", "tx": 259, "ty": 25, "anchor": "middle", "size": 15}, {"id": "g01", "x": 387, "y": 3, "w": 112, "h": 30, "ans": "酸素", "set": "gas", "kind": "text", "tx": 443, "ty": 25, "anchor": "middle", "size": 15}, {"id": "g10", "x": 303, "y": 909, "w": 112, "h": 30, "ans": "酸素", "set": "gas", "kind": "text", "tx": 359, "ty": 931, "anchor": "middle", "size": 15}, {"id": "g11", "x": 487, "y": 909, "w": 112, "h": 30, "ans": "二酸化炭素", "set": "gas", "kind": "text", "tx": 543, "ty": 931, "anchor": "middle", "size": 15}]}];
const SETS = {names:["静脈", "右心房", "右心室", "肺動脈", "肺静脈", "左心房", "左心室", "動脈"], blood:['動脈血','静脈血'], circ:['肺循環','体循環'], gas:['酸素','二酸化炭素']};
const Q = {names:'名前はどれ？', blood:'流れている血液は？', circ:'この循環の名前は？', gas:'どちら？'};
const imgURL = URL.createObjectURL(new Blob([Uint8Array.from(atob(IMG_B64), c => c.charCodeAt(0))], {type:'image/svg+xml'}));
const NS = 'http://www.w3.org/2000/svg';
let cur = 0, gray = false, sel = null;
const st = PAGES.map(() => ({done:{}, miss:0, t0:null, end:null}));
const main = document.getElementById('main');

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function fmt(ms){const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}

function draw(){
  const p = PAGES[cur], S = st[cur];
  main.innerHTML = '';
  const svg = document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox',`0 0 ${p.w} ${p.h}`); svg.setAttribute('class','page'+(gray?' gray':''));
  svg.innerHTML = '<rect width="100%" height="100%" fill="#fff"/>' + p.svg.replaceAll('IMG', imgURL);
  if (gray) svg.classList.add('gray');
  for (const b of p.blanks){
    const g = document.createElementNS(NS,'g'); g.setAttribute('class','bl'+(S.done[b.id]?' done':'')+(sel===b.id?' sel':''));
    let inner = `<rect class="hit" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="6"/>`;
    if (S.done[b.id]){
      if (b.kind==='circle') inner += `<ellipse cx="${b.cx[b.ans]}" cy="${b.cy}" rx="31" ry="15" fill="none" stroke="#1f8a4c" stroke-width="3"/>`;
      else inner += `<text x="${b.tx}" y="${b.ty}" font-size="${b.size||19}" font-weight="bold" fill="#1f8a4c" text-anchor="${b.anchor||'start'}">${b.ans}</text>`;
    }
    g.innerHTML = inner;
    if (!S.done[b.id]) g.addEventListener('click', () => open(b));
    svg.appendChild(g);
  }
  main.appendChild(svg);
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', +t.dataset.p===cur));
  stat();
}
function stat(){
  const p = PAGES[cur], S = st[cur];
  document.getElementById('left').textContent = p.blanks.length - Object.keys(S.done).length;
  document.getElementById('miss').textContent = S.miss;
  document.getElementById('time').textContent = fmt(S.t0 ? (S.end || Date.now()) - S.t0 : 0);
}
setInterval(stat, 500);

function open(b){
  const S = st[cur];
  if (!S.t0) S.t0 = Date.now();
  sel = b.id; draw();
  document.getElementById('q').textContent = Q[b.set];
  const box = document.getElementById('choices');
  box.className = SETS[b.set].length <= 2 ? 'two' : '';
  box.innerHTML = '';
  const opts = b.set==='blood' ? SETS.blood : shuffle(SETS[b.set]);
  for (const o of opts){
    const btn = document.createElement('button'); btn.className = 'ch' + (o==='動脈血'?' art':o==='静脈血'?' ven':''); btn.textContent = o;
    btn.onclick = () => pick(b, o, btn);
    box.appendChild(btn);
  }
  document.getElementById('sheet').classList.add('open');
}
function closeSheet(){ sel = null; document.getElementById('sheet').classList.remove('open'); draw(); }
function pick(b, o, btn){
  const S = st[cur];
  if (o === b.ans){
    S.done[b.id] = true; closeSheet();
    if (Object.keys(S.done).length === PAGES[cur].blanks.length) finish();
  } else {
    S.miss++; btn.disabled = true; stat();
    const g = [...main.querySelectorAll('.bl')][PAGES[cur].blanks.indexOf(b)];
    g.classList.remove('bad'); void g.getBBox(); g.classList.add('bad');
  }
}
function finish(){
  const S = st[cur]; S.end = Date.now(); const t = S.end - S.t0;
  const key = 'junkan_best_'+cur+(gray?'_g':'');
  const prev = JSON.parse(localStorage.getItem(key) || 'null');
  const score = S.miss*100000 + t;   // ミスが少ない方、同じならタイムが短い方
  let msg = '';
  if (!prev || score < prev.score){ localStorage.setItem(key, JSON.stringify({score, miss:S.miss, t})); msg = prev ? '自己ベスト更新！' : 'はじめての記録'; }
  else msg = `自己ベスト　ミス ${prev.miss}・${fmt(prev.t)}`;
  document.getElementById('res').textContent = `ミス ${S.miss}　タイム ${fmt(t)}` + (gray ? '（色なし）' : '');
  document.getElementById('best').textContent = msg;
  document.getElementById('other').textContent = cur===0 ? '裏（循環）へ' : '表（心臓）へ';
  setTimeout(() => document.getElementById('clear').classList.add('show'), 300);
}
function reset(){ st[cur] = {done:{}, miss:0, t0:null, end:null}; sel = null; document.getElementById('clear').classList.remove('show'); closeSheet(); }

document.querySelectorAll('.tab').forEach(t => t.onclick = () => { cur = +t.dataset.p; closeSheet(); window.scrollTo(0,0); });
document.getElementById('close').onclick = closeSheet;
document.getElementById('reset').onclick = reset;
document.getElementById('again').onclick = reset;
document.getElementById('other').onclick = () => { document.getElementById('clear').classList.remove('show'); cur = 1-cur; closeSheet(); window.scrollTo(0,0); };
document.getElementById('gray').onclick = e => { gray = !gray; e.target.classList.toggle('on', gray); reset(); };
draw();
</script></body></html>
